<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tugas pak nopal xpplg1 caesar alexander</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #e5e5e5;
    }

    /* Navbar */
    .navbar {
      background-color: #121212;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #262626;
    }

    .logo {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .nav-links a {
      color: #a3a3a3;
      text-decoration: none;
      margin-left: 18px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    /* Hero Section */
    .hero {
      background-color: #171717;
      text-align: center;
      padding: 60px 20px;
      border-bottom: 2px solid #dc2626; /* Aksen merah Porsche */
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero p {
      font-size: 14px;
      color: #a3a3a3;
      margin-bottom: 24px;
    }

    .btn-mulai {
      background-color: #ffffff;
      color: #0d0d0d;
      border: none;
      padding: 12px 36px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-mulai:hover {
      background-color: #dc2626; /* Berubah jadi merah saat hover */
      color: #ffffff;
    }

    /* Section Layanan */
    .services {
      padding: 40px 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .services h2 {
      font-size: 20px;
      margin-bottom: 24px;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .card {
      background-color: #171717;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .card-box {
      height: 130px;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    /* Gradasi Metallic/Silver dari tema poster Porsche */
    .box-1 { 
      background: linear-gradient(135deg, #d4d4d8, #52525b); 
    }
    .box-2 { 
      background: linear-gradient(135deg, #71717a, #27272a); 
    }
    .box-3 { 
      background: linear-gradient(135deg, #3f3f46, #18181b); 
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 6px;
      color: #f4f4f5;
    }

    .card p {
      font-size: 13px;
      color: #a1a1aa;
    }

    /* Footer */
    footer {
      background-color: #000000;
      color: #737373;
      text-align: center;
      padding: 24px 20px;
      font-size: 12px;
      letter-spacing: 1px;
      border-top: 1px solid #262626;
    }

    footer a {
      color: #a3a3a3;
      text-decoration: none;
      margin: 0 6px;
    }

    footer a:hover {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">caesar</div>
    <div class="nav-links">
      <a href="#">BERANDA</a>
      <a href="#">PRODUK</a>
      <a href="#">KONTAK</a>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero">
    <h1>web caesar</h1>
    
    <button class="btn-mulai">Mulai</button>
  </div>

  <!-- Content Section -->
  <div class="services">
    <h2>Layanan Kami</h2>

    <div class="card">
      <div class="card-box box-1"></div>
      <h3>Layanan 1</h3>
      <p>Deskripsi singkat layanan pertama.</p>
    </div>

    <div class="card">
      <div class="card-box box-2"></div>
      <h3>Layanan 2</h3>
      <p>Deskripsi singkat layanan kedua.</p>
    </div>

    <div class="card">
      <div class="card-box box-3"></div>
      <h3>Layanan 3</h3>
      <p>Deskripsi singkat layanan ketiga.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>MADE IN STUTTGART, GERMANY</p>
    <p style="margin-top: 8px;">
      <a href="#">INSTAGRAM</a> | <a href="#">TWITTER</a> | <a href="#">EMAIL</a>
    </p>
  </footer>

</body>
</html>
